<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edo - Portfolio Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Reset & Base Style */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #f5f5f5; 
            color: #333; 
            line-height: 1.6;
            font-family: 'Courier New', Courier, monospace; 
            min-height: 100vh;
        }

        /* Header Section */
        header {
            display: flex;
            align-items: center;
            padding: 30px 20px;
            background: transparent;
        }
        .profile-img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
            border: 1.5px solid #333;
            background: #fff;
        }
        .profile-info b { font-size: 1.3rem; display: block; font-weight: bold; color: #000; }
        .profile-info span { font-weight: normal; color: #666; font-size: 0.85rem; }

        /* Main Content */
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px 40px; }

        .description {
            text-align: center;
            background: #ffffff; 
            padding: 25px;
            border-radius: 4px;
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }

        /* Tombol Tanpa Efek Bayangan */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .btn {
            padding: 12px 22px;
            border: 2px solid #333; /* Border tegas tanpa bayangan */
            text-decoration: none;
            color: #333;
            background: #fff;
            transition: 0.2s;
            font-size: 1rem;
            font-family: 'Saira Stencil One', cursive;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: none; /* Menghapus bayangan */
        }
        .btn i {
            font-size: 1.2rem;
        }
        .btn:hover {
            background: #333;
            color: #fff;
            transform: none; /* Menghapus efek angkat saat hover */
        }

        /* Testimonial Grid */
        h3 { 
            margin-bottom: 20px; 
            text-align: center; 
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .testi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .testi-item {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }
        .testi-item:hover { 
            border-color: #000;
            opacity: 0.8;
        }

        /* Lightbox (Zoom Effect) */
        #lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95); 
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 80%;
            border: 1px solid #333;
        }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            .profile-img { width: 60px; height: 60px; }
            .testi-grid { grid-template-columns: repeat(3, 1fr); }
            header { padding: 20px; }
            .btn { font-size: 0.85rem; padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img">
        <div class="profile-info">
            <b>EDO.PROJ_V1</b>
            <span>USER_STATUS: ACTIVE</span>
        </div>
    </header>

    <div class="container">
        <section class="description">
            <p>> LOAD DESCRIPTION... <br> 
               Mahasiswa tingkat akhir yang fokus pada pengembangan antarmuka web. Berikut adalah arsip proyek dan testimoni yang tersedia.</p>
        </section>

        <div class="action-buttons">
            <a href="https://wa.me/yournumber" class="btn">
                <i class="fab fa-whatsapp"></i> CONTACT
            </a>
            <a href="#" class="btn">
                CATALOG
            </a>
        </div>

        <h3>-- LOG_TESTIMONI --</h3>
        <div class="testi-grid">
            <img src="https://via.placeholder.com/300?text=IMG_01" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://via.placeholder.com/300?text=IMG_02" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://via.placeholder.com/300?text=IMG_03" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://via.placeholder.com/300?text=IMG_04" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://via.placeholder.com/300?text=IMG_05" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://via.placeholder.com/300?text=IMG_06" class="testi-item" onclick="openLightbox(this.src)">
        </div>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>

</body>
</html>
