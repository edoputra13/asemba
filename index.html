<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEPA STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Reset & Base Style */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            /* Background Kotak-Kotak Estetik */
            background-color: #f5f5f5;
            background-image: 
                linear-gradient(#e1e1e1 1px, transparent 1px),
                linear-gradient(90deg, #e1e1e1 1px, transparent 1px);
            background-size: 20px 20px;
            
            color: #333; 
            line-height: 1.6;
            font-family: 'Courier New', Courier, monospace; 
            min-height: 100vh;
        }

        /* Header Section */
        header {
            display: flex;
            align-items: center;
            padding: 30px 20px;
            background: transparent;
        }
        .profile-img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
            border: 1.5px solid #333;
            background: #fff;
        }
        
        /* Nama Profil tetap Segoe UI */
        .profile-info b { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.4rem; 
            display: block; 
            font-weight: bold; 
            color: #000; 
            letter-spacing: -0.5px;
        }
        .profile-info span { font-weight: normal; color: #666; font-size: 0.85rem; }

        /* Main Content */
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px 40px; position: relative; }

        /* Kotak Deskripsi tetap Helvetica */
        .description {
            text-align: center;
            background: #ffffff; 
            padding: 25px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .description p { font-size: 1rem; color: #444; }

        /* Highlight Photo Slide */
        .highlight-slider {
            width: 100%;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid #ddd;
            background: #fff;
            padding: 10px;
            border-radius: 4px;
        }
        .slider-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #555;
            font-weight: bold;
        }
        .slider-track {
            display: flex;
            gap: 10px;
            animation: scrollSlider 20s linear infinite;
        }
        .slider-track:hover { animation-play-state: paused; }
        .slider-item {
            flex: 0 0 250px;
            height: 150px;
            object-fit: cover;
            border: 1px solid #eee;
            cursor: pointer;
            transition: 0.2s;
        }

        @keyframes scrollSlider {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-260px * 4)); }
        }

        /* Tombol tetap Saira Stencil */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .btn {
            padding: 12px 22px;
            border: 2px solid #333;
            text-decoration: none;
            color: #333;
            background: #fff;
            transition: 0.2s;
            font-size: 1rem;
            font-family: 'Saira Stencil One', cursive;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Ikon Berwarna */
        .btn i.fa-whatsapp {
            color: #25D366;
            font-size: 1.4rem;
        }
        .btn i.fa-book-open {
            color: #3498db; /* Warna Biru Katalog */
            font-size: 1.2rem;
        }

        .btn:hover { background: #333; color: #fff; }

        /* Testimonial Grid */
        h3 { 
            margin-bottom: 20px; 
            text-align: center; 
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .testi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .testi-item {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95); 
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        #lightbox img { max-width: 90%; max-height: 80%; border: 1px solid #333; }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            .profile-img { width: 60px; height: 60px; }
            .testi-grid { grid-template-columns: repeat(3, 1fr); }
            .slider-item { flex: 0 0 180px; height: 120px; }
            @keyframes scrollSlider {
                0% { transform: translateX(0); }
                100% { transform: translateX(calc(-190px * 4)); }
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="polisi.jpg" alt="Profile" class="profile-img">
        <div class="profile-info">
            <b>DEEPA STORE</b>
            <span>STATUS: Active</span>
        </div>
    </header>

    <div class="container">
        <section class="description">
            <p>Akun utama X ke suspend, katakan fak untuk elon😂 .</p>
        </section>

        <div class="highlight-slider">
            <div class="slider-title">>> BIASANYA INFORMASI</div>
            <div class="slider-track">
                <img src="galeri1.jpg" class="slider-item" onclick="openLightbox(this.src)">
                <img src="https://via.placeholder.com/500x300?text=Project+2" class="slider-item" onclick="openLightbox(this.src)">
                <img src="https://via.placeholder.com/500x300?text=Project+3" class="slider-item" onclick="openLightbox(this.src)">
                <img src="https://via.placeholder.com/500x300?text=Project+4" class="slider-item" onclick="openLightbox(this.src)">
                <img src="https://via.placeholder.com/500x300?text=Project+1" class="slider-item" onclick="openLightbox(this.src)">
                <img src="https://via.placeholder.com/500x300?text=Project+2" class="slider-item" onclick="openLightbox(this.src)">
            </div>
        </div>

        <div class="action-buttons">
            <a href="https://wa.me/6281717622225" class="btn">
                <i class="fab fa-whatsapp"></i> CONTACT
            </a>
            <a href="#" class="btn">
                <i class="fas fa-book-open"></i> CATALOG
            </a>
        </div>

        <h3>-- TESTIMONI --</h3>
        <div class="testi-grid">
            <img src="https://image2url.com/images/1765628053757-a4c01680-4f60-4e8f-8980-042071655a28.jpg" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://image2url.com/images/1765628327495-9c5b63fd-0f90-4771-8786-d1df6e04dea3.jpg" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://image2url.com/images/1765628365941-9854998d-d820-478d-9268-ba1aa80bdd14.jpg" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://image2url.com/images/1765628395076-d30e2e08-127f-4eb5-9154-5f5edafd02bc.jpg" class="testi-item" onclick="openLightbox(this.src)">
        </div>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>

</body>
</html>
