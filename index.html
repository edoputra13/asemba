<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEPA STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Reset & Base Style */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #f5f5f5;
            background-image: 
                linear-gradient(#e1e1e1 1px, transparent 1px),
                linear-gradient(90deg, #e1e1e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333; 
            line-height: 1.6;
            font-family: 'Courier New', Courier, monospace; 
            min-height: 100vh;
        }

        /* ==================== FITUR BARU: POPUP GREETING OTOMATIS ==================== */
        .greeting-popup {
            position: fixed;
            top: 20px;
            right: 20px; 
            transform: translateX(150%); 
            
            /* --- TEMA GLASSMORPHISM --- */
            background: rgba(255, 255, 255, 0.35); /* Transparansi ditingkatkan */
            backdrop-filter: blur(16px); /* Efek blur kaca diperkuat */
            -webkit-backdrop-filter: blur(16px);
            /* Efek pantulan cahaya di ujung kaca (kiri & atas lebih terang) */
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15); /* Bayangan lebih dramatis agar mengambang */
            /* -------------------------- */

            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            gap: 6px;
            z-index: 9999;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            color: #222;
            display: flex;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* State saat popup aktif muncul */
        .greeting-popup.show {
            opacity: 1;
            transform: translateX(0); /* Geser masuk ke posisi asli (right: 20px) */
        }
        /* ============================================================================== */

        /* Header Section */
        header {
            display: flex;
            align-items: center;
            padding: 30px 20px;
            background: transparent;
        }

        .profile-container {
            position: relative;
            width: 72px; 
            height: 72px;
            margin-right: 15px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .profile-container::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(#ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            animation: rotate-rgb 6s linear infinite;
        }
        .profile-img {
            width: 69px; 
            height: 69px;
            border-radius: 8px;
            object-fit: cover;
            z-index: 2; 
            background: #fff;
        }
        @keyframes rotate-rgb {
            100% { transform: rotate(360deg); }
        }
        
        .profile-info b { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.4rem; 
            display: block; 
            font-weight: bold; 
            color: #000; 
            letter-spacing: -0.5px;
        }
        .profile-info span { font-weight: normal; color: #666; font-size: 0.85rem; }

        /* Main Content */
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px 40px; position: relative; }

        .description {
            text-align: center;
            background: #ffffff; 
            padding: 25px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .description p { font-size: 1rem; color: #444; }

        /* GALERI FOTO (CENTER SNAP) */
        .highlight-slider {
            width: 100%;
            margin-bottom: 30px;
            border: 1px solid #ddd;
            background: #fff;
            padding: 10px 0; 
            border-radius: 4px;
            position: relative; 
        }
        .slider-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #555;
            font-weight: bold;
            padding: 0 10px; 
        }
        .slider-container {
            width: 100%;
            overflow-x: auto; 
            scroll-behavior: smooth; 
            scrollbar-width: none; 
        }
        .slider-container::-webkit-scrollbar {
            display: none; 
        }
        .slider-track {
            display: flex;
            gap: 10px;
            scroll-snap-type: x mandatory; 
            padding: 0 calc(50% - 125px);
        }
        .slider-item {
            flex: 0 0 250px;
            height: 150px;
            object-fit: cover;
            border: 1px solid #eee;
            cursor: pointer;
            transition: 0.2s;
            scroll-snap-align: center; 
        }
        
        /* TOMBOL NAVIGASI */
        .nav-btn {
            position: absolute;
            top: calc(50% + 10px);
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 6px; 
            z-index: 5;
            background: transparent; 
            color: rgba(0, 0, 0, 0.7); 
            font-size: 0.85rem; 
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            background-size: 100%, 400%;
            animation: rgb-animation 15s linear infinite; 
            transition: transform 0.2s, color 0.2s;
        }
        
        @keyframes rgb-animation {
            0% { background-position: 0% 50%, 0% 50%; }
            50% { background-position: 0% 50%, 100% 50%; }
            100% { background-position: 0% 50%, 0% 50%; }
        }

        .nav-btn:hover { 
            transform: translateY(-50%) scale(1.1);
            color: #000; 
        }
        
        .nav-btn.prev { left: 5px; } 
        .nav-btn.next { right: 5px; }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .btn {
            padding: 12px 22px;
            border: 2px solid #333;
            text-decoration: none;
            color: #333;
            background: #fff;
            transition: 0.2s;
            font-size: 1rem;
            font-family: 'Saira Stencil One', cursive;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn i.fa-whatsapp { color: #25D366; font-size: 1.4rem; }
        .btn i.fa-book-open { color: #3498db; font-size: 1.2rem; }
        .btn:hover { background: #333; color: #fff; }

        /* Testimonial Grid */
        h3 { 
            margin-bottom: 20px; 
            text-align: center; 
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .testi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .testi-item {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95); 
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        #lightbox img { max-width: 90%; max-height: 80%; border: 1px solid #333; }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            .profile-container { width: 62px; height: 62px; border-radius: 8px; }
            .profile-img { width: 59px; height: 59px; border-radius: 6px; }
            
            .testi-grid { grid-template-columns: repeat(3, 1fr); }
            
            .slider-track { padding: 0 calc(50% - 90px); }
            .slider-item { flex: 0 0 180px; height: 120px; }
            
            .nav-btn { width: 28px; height: 28px; font-size: 0.75rem; border-radius: 5px; }
            .nav-btn.prev { left: 5px; }
            .nav-btn.next { right: 5px; }
            
            /* Sedikit penyesuaian popup agar tidak terlalu menempel tepi di mobile */
            .greeting-popup { right: 15px; top: 15px; }
        }
    </style>
</head>
<body>

    <div id="greetingPopup" class="greeting-popup">
        <span id="greetingIcon"></span>
        <span id="greetingText"></span>
    </div>

    <header>
        <div class="profile-container">
            <img src="polisi.jpg" alt="Profile" class="profile-img">
        </div>
        <div class="profile-info">
            <b>DEEPA STORE</b>
            <span>STATUS: Active</span>
        </div>
    </header>

    <div class="container">
        <section class="description">
            <p>Akun utama X ke suspend, katakan fak untuk elon😂 .</p>
        </section>

        <div class="highlight-slider">
            <div class="slider-title">>> BIASANYA INFORMASI</div>
            
            <button class="nav-btn prev" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
            <button class="nav-btn next" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>
            
            <div class="slider-container" id="sliderContainer">
                <div class="slider-track">
                    <img src="galeri1.jpg" class="slider-item" onclick="openLightbox(this.src)">
                    <img src="https://via.placeholder.com/500x300?text=Project+2" class="slider-item" onclick="openLightbox(this.src)">
                    <img src="https://via.placeholder.com/500x300?text=Project+3" class="slider-item" onclick="openLightbox(this.src)">
                    <img src="https://via.placeholder.com/500x300?text=Project+4" class="slider-item" onclick="openLightbox(this.src)">
                    <img src="https://via.placeholder.com/500x300?text=Project+1" class="slider-item" onclick="openLightbox(this.src)">
                    <img src="https://via.placeholder.com/500x300?text=Project+2" class="slider-item" onclick="openLightbox(this.src)">
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <a href="https://wa.me/6281717622225" class="btn">
                <i class="fab fa-whatsapp"></i> CONTACT
            </a>
            <a href="catalog.html" class="btn">
                <i class="fas fa-book-open"></i> CATALOG
            </a>
        </div>

        <h3>-- TESTIMONI --</h3>
        <div class="testi-grid">
            <img src="https://image2url.com/images/1765628053757-a4c01680-4f60-4e8f-8980-042071655a28.jpg" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://image2url.com/images/1765628327495-9c5b63fd-0f90-4771-8786-d1df6e04dea3.jpg" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://image2url.com/images/1765628365941-9854998d-d820-478d-9268-ba1aa80bdd14.jpg" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://image2url.com/images/1765628395076-d30e2e08-127f-4eb5-9154-5f5edafd02bc.jpg" class="testi-item" onclick="openLightbox(this.src)">
            <img src="https://drive.google.com/uc?export=view&id=184YKnOmTpei-Naceg5NxA8ty95TRRmwi" class="testi-item" onclick="openLightbox(this.src)">
        </div>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="">
    </div>

    <script>
        // Logika Lightbox
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // Logika Geser Galeri Manual
        function moveSlide(direction) {
            const container = document.getElementById('sliderContainer');
            const itemWidth = container.querySelector('.slider-item').offsetWidth + 10; 
            container.scrollBy({ left: direction * itemWidth, behavior: 'smooth' }); 
        }

        // WAKTU & POPUP
        window.addEventListener('DOMContentLoaded', () => {
            const hours = new Date().getHours();
            let greetingText = "";
            let greetingIcon = "";

            if (hours >= 3 && hours < 11) {
                greetingText = "Selamat Pagi!";
                greetingIcon = "🌅";
            } else if (hours >= 11 && hours < 15) {
                greetingText = "Selamat Siang!";
                greetingIcon = "☀️";
            } else if (hours >= 15 && hours < 18.5) {
                greetingText = "Selamat Sore!";
                greetingIcon = "🌇";
            } else {
                greetingText = "Selamat Malam!";
                greetingIcon = "🌌";
            }

            document.getElementById('greetingIcon').innerText = greetingIcon;
            document.getElementById('greetingText').innerText = greetingText;

            const popup = document.getElementById('greetingPopup');
            
            setTimeout(() => { popup.classList.add('show'); }, 300);
            setTimeout(() => { popup.classList.remove('show'); }, 4300);
        });
    </script>

</body>
</html>
