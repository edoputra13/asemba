<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATALOG - DEEPA STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Reset & Base Style */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #f5f5f5;
            background-image: 
                linear-gradient(#e1e1e1 1px, transparent 1px),
                linear-gradient(90deg, #e1e1e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333; 
            line-height: 1.6;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            min-height: 100vh;
        }

        /* Container Utama */
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 30px 20px 60px; 
        }

        /* Header / Navigasi Atas */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h2.title {
            font-family: 'Saira Stencil One', cursive;
            font-size: 1.8rem;
            color: #222;
            letter-spacing: 1px;
        }

        /* Tombol Navigasi */
        .btn {
            padding: 10px 18px;
            border: 2px solid #333;
            text-decoration: none;
            color: #333;
            background: #fff;
            transition: 0.2s;
            font-size: 0.9rem;
            font-family: 'Saira Stencil One', cursive;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 4px;
        }
        .btn:hover { background: #333; color: #fff; }

        /* Grid Katalog */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Kartu Produk */
        .product-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #222;
        }

        .product-price {
            color: #ff5722;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .btn-buy {
            margin-top: auto;
            width: 100%;
            text-align: center;
            justify-content: center;
            border-color: #25D366;
            color: #25D366;
        }
        .btn-buy:hover {
            background: #25D366;
            color: #fff;
            border-color: #25D366;
        }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            .header-nav { flex-direction: column; gap: 15px; text-align: center; }
            .catalog-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
            .product-img { height: 150px; }
            .product-title { font-size: 0.95rem; }
            .product-price { font-size: 1rem; }
            .btn-buy { font-size: 0.8rem; padding: 8px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-nav">
            <h2 class="title"><i class="fas fa-shopping-bag"></i> KATALOG PRODUK</h2>
            <a href="index.html" class="btn">
                <i class="fas fa-arrow-left"></i> KEMBALI
            </a>
        </div>

        <div class="catalog-grid">
            
            <div class="product-card">
                <img src="https://via.placeholder.com/300x300?text=Produk+1" alt="Produk 1" class="product-img">
                <div class="product-info">
                    <div class="product-title">Item Nama Produk 1</div>
                    <div class="product-price">Rp 50.000</div>
                    <a href="https://wa.me/6281717622225?text=Halo%20saya%20ingin%20pesan%20Produk%201" class="btn btn-buy" target="_blank">
                        <i class="fab fa-whatsapp"></i> PESAN
                    </a>
                </div>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300x300?text=Produk+2" alt="Produk 2" class="product-img">
                <div class="product-info">

                    <a href="https://wa.me/6281717622225?text=Halo%20saya%20ingin%20pesan%20Produk%202" class="btn btn-buy" target="_blank">
                        <i class="fab fa-whatsapp"></i> PESAN
                    </a>
                </div>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300x300?text=Produk+3" alt="Produk 3" class="product-img">
                <div class="product-info">
                    <div class="product-title">Item Nama Produk 3</div>
                    <div class="product-price">Rp 120.000</div>
                    <a href="https://wa.me/6281717622225?text=Halo%20saya%20ingin%20pesan%20Produk%203" class="btn btn-buy" target="_blank">
                        <i class="fab fa-whatsapp"></i> PESAN
                    </a>
                </div>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300x300?text=Produk+4" alt="Produk 4" class="product-img">
                <div class="product-info">
                    <div class="product-title">Item Nama Produk 4</div>
                    <div class="product-price">Rp 99.000</div>
                    <a href="https://wa.me/6281717622225?text=Halo%20saya%20ingin%20pesan%20Produk%204" class="btn btn-buy" target="_blank">
                        <i class="fab fa-whatsapp"></i> PESAN
                    </a>
                </div>
            </div>

        </div> </div>

</body>
</html>
